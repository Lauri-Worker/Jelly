<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f5f4f0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="description" content="Handschriftliche Notizen, PDFs annotieren und Notizbücher organisieren – direkt im Browser.">
  <title>Jelly Notes</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Jelly Notes">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Anmeldung (nur aktiv, wenn Supabase in config.js eingetragen ist) -->
  <section id="auth" class="view hidden">
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="brand"><img src="icon.svg" alt="" width="32" height="32"><span>Jelly Notes</span></div>
        <div class="auth-head">
          <h1 id="auth-title">Anmelden</h1>
          <p id="auth-sub" class="auth-sub"></p>
        </div>
        <form id="auth-form" class="auth-form" novalidate>
          <label class="field" id="f-email"><span>E-Mail</span><input id="auth-email" type="email" autocomplete="email" inputmode="email" placeholder="name@beispiel.de"></label>
          <label class="field" id="f-pass"><span>Passwort</span><input id="auth-pass" type="password" autocomplete="current-password" minlength="6" placeholder="Mindestens 6 Zeichen"></label>
          <label class="field" id="f-pass2" hidden><span>Passwort wiederholen</span><input id="auth-pass2" type="password" autocomplete="new-password" minlength="6"></label>
          <p id="auth-msg" class="auth-msg" role="alert"></p>
          <button class="btn primary block" id="auth-submit" type="submit">Anmelden</button>
        </form>
        <div class="auth-links">
          <button type="button" class="link" id="auth-forgot">Passwort vergessen?</button>
          <p id="auth-switch"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Bibliothek -->
  <section id="library" class="view hidden">
    <div class="lib-layout">
      <!-- Seitenleiste -->
      <aside id="lib-side" class="lib-side">
        <div class="side-head">
          <button class="ibtn" id="btn-side-close" title="Seitenleiste ausblenden" aria-label="Seitenleiste ausblenden"><span data-icon="sidebar"></span></button>
        </div>
        <nav class="side-nav" aria-label="Bereiche">
          <button class="side-item" data-view="docs" type="button"><span class="side-ic docs-ic"></span><span>Dokumente</span></button>
          <button class="side-item" data-view="fav" type="button"><span class="side-ic" data-icon="bookmark"></span><span>Favoriten</span></button>
          <button class="side-item" data-view="shared" type="button"><span class="side-ic" data-icon="people"></span><span>Geteilt</span></button>
        </nav>
      </aside>
      <div class="side-scrim" id="side-scrim" hidden></div>

      <div class="lib-content">
        <header class="lib-top">
          <div class="lib-top-left">
            <button class="ibtn" id="btn-side-open" title="Seitenleiste einblenden" aria-label="Seitenleiste einblenden"><span data-icon="sidebar"></span></button>
            <button class="circle-btn" id="btn-lib-back" title="Zurück" aria-label="Zurück"><span data-icon="back"></span></button>
          </div>
          <div class="lib-top-title" id="lib-title">Dokumente</div>
          <div class="lib-top-right">
            <button class="top-ic" id="btn-search" title="Suchen" aria-label="Suchen"><span data-icon="search"></span></button>
            <button class="top-ic" id="btn-bell" title="Neuigkeiten" aria-label="Neuigkeiten"><span data-icon="bell"></span><span class="bell-dot" id="bell-dot" hidden></span></button>
            <button class="avatar" id="btn-avatar" title="Profil und Einstellungen" aria-label="Profil und Einstellungen">J</button>
          </div>
          <div class="search-wrap" id="search-wrap" hidden>
            <span data-icon="search"></span>
            <input id="search" type="search" placeholder="In allen Dokumenten suchen" autocomplete="off">
            <button class="link" id="btn-search-close" type="button">Abbrechen</button>
          </div>
        </header>

        <div class="lib-bar">
          <button class="filter-btn" id="lib-filter" type="button"><span data-icon="filter"></span><span id="lib-filter-label">Alle</span></button>
          <div class="lib-bar-right">
            <button class="btn primary" id="btn-new"><span data-icon="plus"></span><span class="lbl">Neu</span></button>
            <button class="btn ghost" id="btn-empty-trash" hidden><span data-icon="trash"></span><span>Papierkorb leeren</span></button>
            <button class="ibtn" id="btn-layout" title="Ansicht wechseln" aria-label="Ansicht wechseln"><span data-icon="gridView"></span></button>
            <span class="bar-sep"></span>
            <button class="ibtn cloud-ic" id="btn-cloud" title="Cloud-Status" aria-label="Cloud-Status"><span data-icon="cloudOff"></span></button>
          </div>
        </div>

        <main class="lib-main">
          <p class="lib-note" id="lib-note" hidden></p>
          <nav id="crumbs" class="crumbs" aria-label="Ordnerpfad" hidden></nav>
          <div id="nb-grid" class="nb-grid"></div>
        </main>
      </div>
    </div>
  </section>

  <!-- Editor -->
  <section id="editor" class="view hidden">
    <!-- Tabs mit geöffneten Notizbüchern -->
    <header class="tabbar">
      <button class="tab-home" id="btn-back" title="Bibliothek" aria-label="Zur Bibliothek"><span data-icon="home"></span></button>
      <div class="tabs" id="tabs" role="tablist" aria-label="Geöffnete Dokumente"></div>
    </header>
    <!-- Werkzeugleiste -->
    <div class="ed-toolbar">
      <div class="tb-group tb-left">
        <button class="tbtn" id="btn-sidebar" title="Seitenübersicht" aria-label="Seitenübersicht"><span data-icon="sidebar"></span></button>
        <button class="tbtn" id="btn-doc-search" title="Im Dokument suchen" aria-label="Im Dokument suchen"><span data-icon="search"></span></button>
        <button class="tbtn" id="btn-bookmarks" title="Lesezeichen" aria-label="Lesezeichen"><span data-icon="bookmark"></span></button>
        <input id="nb-title" class="title-input" spellcheck="false" aria-label="Titel" hidden>
        <span id="save-status" class="save-status" hidden></span>
      </div>
      <div class="tools" id="tools">
        <button class="tool" data-tool="lasso" title="Lasso (L) – nochmal tippen für Optionen"><span data-icon="lasso"></span><span class="lasso-chev" data-icon="chev"></span></button>
        <button class="tool" data-tool="pen" title="Stift (P)"><span data-icon="pen"></span></button>
        <button class="tool" data-tool="highlighter" title="Textmarker (H)"><span data-icon="highlighter"></span></button>
        <button class="tool" data-tool="eraser" title="Radierer (E)"><span data-icon="eraser"></span></button>
        <button class="tool" data-tool="text" title="Textfeld (T)"><span data-icon="textbox"></span></button>
        <button class="tool" data-tool="note" title="Haftnotiz (N)"><span data-icon="note"></span></button>
        <button class="tool" id="btn-insert" title="Bild, PDF oder Scan einfügen"><span data-icon="image"></span></button>
        <button class="tool" data-tool="shape" title="Formen (S)"><span data-icon="shapes"></span></button>
        <button class="tool" data-tool="laser" title="Laserpointer (K)"><span data-icon="laser"></span></button>
        <span class="tools-sep"></span>
        <button class="tool" id="btn-mic" title="Sprachaufnahme"><span data-icon="mic"></span><span class="rec-time" id="rec-time" hidden></span></button>
        <button class="tool tool-wide" id="btn-view" title="Ansicht"><span data-icon="viewMode"></span><span data-icon="chev" class="mini-chev"></span></button>
      </div>
      <div class="tb-group tb-right">
        <button class="tbtn" id="btn-page" title="Seite hinzufügen und Seiten verwalten" aria-label="Seite hinzufügen"><span data-icon="pagePlus"></span></button>
        <button class="tbtn" id="btn-export" title="Teilen und exportieren" aria-label="Teilen und exportieren"><span data-icon="share"></span></button>
        <button class="tbtn" id="btn-more" title="Mehr" aria-label="Mehr"><span data-icon="moreCircle"></span></button>
      </div>
    </div>
    <div class="editor-body">
      <div class="floating undo-pill">
        <button class="ibtn" id="btn-undo" title="Rückgängig (Strg+Z)" aria-label="Rückgängig"><span data-icon="undo"></span></button>
        <button class="ibtn" id="btn-redo" title="Wiederholen (Strg+Umschalt+Z)" aria-label="Wiederholen"><span data-icon="redo"></span></button>
      </div>
      <div class="toolrow" id="toolrow"><div class="options" id="options"></div></div>
      <aside id="sidebar">
        <div id="thumbs"></div>
        <button class="btn ghost small add-thumb" id="btn-add-page-side"><span data-icon="plus"></span>Seite</button>
      </aside>
      <div id="viewer">
        <div id="pages"></div>
        <div class="pages-end"><button class="btn ghost" id="btn-add-page-end"><span data-icon="plus"></span>Seite hinzufügen</button></div>
      </div>
      <div class="floating zoom-ctl">
        <button class="ibtn sm" id="btn-zoom-out" title="Verkleinern"><span data-icon="minus"></span></button>
        <button class="zoom-val" id="btn-zoom-fit" title="An Breite anpassen">100%</button>
        <button class="ibtn sm" id="btn-zoom-in" title="Vergrößern"><span data-icon="plus"></span></button>
      </div>
      <div class="floating page-ind" id="page-ind">1 / 1</div>
    </div>
  </section>

  <!-- Neues Notizbuch -->
  <dialog id="dlg-new">
    <form method="dialog" class="dlg">
      <h2>Neues Notizbuch</h2>
      <label class="field"><span>Titel</span><input id="new-title" required maxlength="80" placeholder="Unbenanntes Notizbuch"></label>
      <div class="field"><span>Cover</span><div class="swatches" id="new-covers"></div></div>
      <div class="field"><span>Papier</span><div class="paper-grid" id="new-papers"></div></div>
      <div class="field-row">
        <div class="field"><span>Papierfarbe</span><div class="seg" id="new-pcolor"></div></div>
        <div class="field"><span>Format</span><div class="seg" id="new-orient"></div></div>
      </div>
      <div class="dlg-actions">
        <button class="btn ghost" value="cancel" formnovalidate>Abbrechen</button>
        <button class="btn primary" value="ok" id="new-ok">Erstellen</button>
      </div>
    </form>
  </dialog>

  <!-- Dokumenten-Scanner -->
  <div id="scanner" class="scanner" hidden>
    <header class="scan-bar">
      <button class="scan-btn" id="scan-cancel" type="button">Abbrechen</button>
      <div class="scan-title" id="scan-title">Scannen</div>
      <button class="scan-btn strong" id="scan-finish" type="button" hidden>Einfügen</button>
    </header>
    <div class="scan-stage" id="scan-stage">
      <div class="scan-loading" id="scan-loading">Foto wird geladen …</div>
      <div class="scan-frame" id="scan-frame" hidden>
        <canvas id="scan-canvas"></canvas>
        <svg id="scan-svg" class="scan-svg"><polygon id="scan-poly"></polygon></svg>
        <div class="scan-handle" data-i="0"></div>
        <div class="scan-handle" data-i="1"></div>
        <div class="scan-handle" data-i="2"></div>
        <div class="scan-handle" data-i="3"></div>
      </div>
      <div class="scan-review" id="scan-review" hidden></div>
    </div>
    <footer class="scan-tools" id="scan-adjust">
      <div class="scan-hint">Ziehe die Ecken auf die Ränder des Blatts.</div>
      <div class="scan-row">
        <div class="seg dark" id="scan-filter"></div>
      </div>
      <div class="scan-row">
        <button class="scan-btn" id="scan-retake" type="button">Neu aufnehmen</button>
        <button class="scan-btn" id="scan-full" type="button">Ganzes Bild</button>
        <button class="scan-btn primary" id="scan-accept" type="button">Seite übernehmen</button>
      </div>
    </footer>
    <footer class="scan-tools" id="scan-more" hidden>
      <div class="scan-row">
        <button class="scan-btn" id="scan-next-cam" type="button">Weitere Seite scannen</button>
        <button class="scan-btn" id="scan-next-pick" type="button">Aus Fotos wählen</button>
      </div>
    </footer>
  </div>

  <dialog id="dlg-info" class="info-dlg">
    <form method="dialog" class="dlg">
      <div class="info-head"><h2 id="info-title"></h2><button class="ibtn" value="close" aria-label="Schließen"><span data-icon="close"></span></button></div>
      <div class="info-body" id="info-body"></div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <input type="file" id="file-pdf" accept="application/pdf" hidden>
  <input type="file" id="file-pdf-append" accept="application/pdf" hidden>
  <input type="file" id="file-backup" accept="application/json,.json" hidden>
  <input type="file" id="file-image" accept="image/*" hidden>
  <input type="file" id="file-scan" accept="image/*" capture="environment" hidden>
  <input type="file" id="file-scan-pick" accept="image/*" multiple hidden>

  <script type="module" src="app.js"></script>
</body>
</html>
